<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Bill | Bhavnaben Khakhrawala</title><link rel="icon" href="/images/logo.png">
<style>
:root{--o:#f26a1b;--r:#d62a1a;--y:#ffc21a;--br:#3b2113;--cr:#fff7e3;--g:#1b7a3a}
*{box-sizing:border-box;margin:0}body{font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#efe6d2;color:#2a1a10;padding:18px 12px 60px}
.bar{max-width:820px;margin:0 auto 14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.bar a,.bar button{font:600 14px system-ui,sans-serif;border:0;border-radius:99px;padding:10px 20px;cursor:pointer;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--o),var(--r))}
.bar .wa{background:linear-gradient(135deg,#25d366,#128c7e)}.bar .g{background:#fff;color:var(--br);box-shadow:0 0 0 2px var(--br) inset}
.inv{max-width:820px;margin:auto;background:#fff;border-radius:6px;box-shadow:0 12px 40px #3b211333;overflow:hidden;position:relative}
.top{height:10px;background:linear-gradient(90deg,var(--r),var(--o),var(--y))}
.hd{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 34px 18px;flex-wrap:wrap;background:linear-gradient(180deg,#fff7e3,#fff)}
.hd img{height:78px;width:auto;display:block}
.sh{font-size:12.5px;color:#5a4636;line-height:1.5;margin-top:6px;max-width:340px}
.ti{text-align:right}.ti h1{font:800 30px Georgia,'Times New Roman',serif;letter-spacing:.08em;color:var(--br)}.ti .no{font-weight:700;color:var(--r);font-size:15px;margin-top:2px}.ti small{display:block;color:#6a5646}
.st{display:inline-block;margin-top:6px;padding:2px 12px;border-radius:99px;background:#e6f4ea;color:var(--g);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.bd{padding:6px 34px 28px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:14px 0 20px}
.bx{background:var(--cr);border-radius:10px;padding:12px 16px;border-left:4px solid var(--o)}.bx h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--r);margin-bottom:4px}.bx b{font-size:15px}
table{width:100%;border-collapse:collapse}th{background:var(--br);color:#fff;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:10px 12px}th.n,td.n{text-align:right;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #f0e6d2;vertical-align:top}tr:nth-child(even) td{background:#fffaf0}td small{color:#7a6656}
.sm{display:flex;justify-content:flex-end;margin-top:16px}.sm table{width:320px;max-width:100%}.sm td{border:0;padding:6px 12px;background:none!important}
.sm .dc td{color:var(--g);font-weight:600}.sm .gt td{border-top:2px solid var(--br);font-size:19px;font-weight:800;color:var(--br);padding-top:10px}.sm .gt td.n{color:var(--r)}
.cp{display:inline-block;background:#e6f4ea;color:var(--g);border:1px dashed var(--g);border-radius:6px;padding:0 8px;font-size:12px;margin-left:4px;letter-spacing:.05em}
.sv{margin-top:18px;background:#e6f4ea;color:var(--g);border-radius:10px;padding:9px 14px;font-weight:600;text-align:center}
.ft{text-align:center;border-top:1px dashed #cdbb9a;margin:26px 0 0;padding-top:16px;color:#6a5646;font-size:12.5px}.ft b{color:var(--br);font-size:15px;display:block;margin-bottom:2px}
.wm{position:absolute;right:-40px;bottom:60px;width:330px;opacity:.05;pointer-events:none}
#msg{max-width:820px;margin:60px auto;text-align:center;background:#fff;border-radius:16px;padding:40px}
@media(max-width:600px){.hd,.bd{padding-left:16px;padding-right:16px}.two{grid-template-columns:1fr}.ti{text-align:left}.hd img{height:62px}th:nth-child(2),td:nth-child(2){display:none}}
@media print{body{background:#fff;padding:0}.bar{display:none}.inv{box-shadow:none;border-radius:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div id="msg">Loading your bill...</div>
<script>
const $=s=>document.querySelector(s),Q=new URLSearchParams(location.search),R=n=>'₹'+(+n).toLocaleString('en-IN',{minimumFractionDigits:(+n%1?2:0),maximumFractionDigits:2}),
e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
wn=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length==12&&d.startsWith('91'))return d;if(d.length==11&&d[0]=='0')d=d.slice(1);if(d.length>=10)return '91'+d.slice(-10);return ''},
fd=d=>new Date(String(d).replace(' ','T')+'Z').toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'});
(async()=>{try{
 const no=(Q.get('no')||'').replace(/[^A-Za-z0-9]/g,''),t=Q.get('t')||'';if(!no)throw 0;
 const r=await fetch('/api/bill/'+no+'?t='+encodeURIComponent(t));if(!r.ok)throw 0;const o=await r.json(),n=wn(o.phone),link=location.origin+'/bill.html?no='+o.order_no+'&t='+encodeURIComponent(t);
 const wt='🧾 *Bhavnaben Khakhrawala*%0A*Bill No:* '+o.order_no+'%0A*Total:* '+R(o.total)+'%0A%0AView / download your bill:%0A'+encodeURIComponent(link);
 document.title='Bill '+o.order_no+' | Bhavnaben Khakhrawala';
 document.body.innerHTML=`<div class="bar">${n?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${n}?text=${wt}">📲 Send on WhatsApp</a>`:''}<button onclick="print()">🖨️ Print / Save PDF</button></div>
<div class="inv"><div class="top"></div><img class="wm" src="/images/logo.png" alt="">
<div class="hd"><div><img src="/images/logo.png" alt="Bhavnaben Khakhrawala"><div class="sh">Plot no. B1-B2, Kailash Rowhouse, opp. Mahavir Height, New Kosad Road, Amroli, Surat - 394107<br>📞 +91 99255 20051 · +91 99988 02435<br>FSSAI Lic No: 20718031000014</div></div>
<div class="ti"><h1>BILL</h1><div class="no">#${e(o.order_no)}</div><small>${e(fd(o.date))}</small><span class="st">${e(o.status)}</span></div></div>
<div class="bd"><div class="two"><div class="bx"><h4>Billed to</h4><b>${e(o.name)}</b><br>${e(o.phone)}${o.email?'<br>'+e(o.email):''}</div><div class="bx"><h4>Delivery address</h4>${e(o.address)||'-'}<br>${e([o.city,o.pincode].filter(Boolean).join(' - '))}</div></div>
<table><thead><tr><th>#</th><th>Product</th><th>Pack</th><th class="n">Rate</th><th class="n">Qty</th><th class="n">Amount</th></tr></thead><tbody>${o.items.map((i,k)=>`<tr><td>${k+1}</td><td><b>${e(i.product_name)}</b><br><small>${e(i.flavour)}</small></td><td>${e(i.size_label)}${i.vac?'<br><small>Vacuum pack</small>':''}</td><td class="n">${i.price!=null?R(i.price):'-'}</td><td class="n">${i.qty}</td><td class="n"><b>${i.price!=null?R(i.price*i.qty):'-'}</b></td></tr>`).join('')}</tbody></table>
<div class="sm"><table><tr><td>Subtotal</td><td class="n">${R(o.subtotal)}</td></tr>${o.discount>0?`<tr class="dc"><td>Coupon discount${o.coupon?` <span class="cp">${e(o.coupon)}</span>`:''}</td><td class="n">− ${R(o.discount)}</td></tr>`:''}<tr class="gt"><td>Total</td><td class="n">${R(o.total)}</td></tr></table></div>
${o.discount>0?`<div class="sv">🎉 You saved ${R(o.discount)} on this order</div>`:''}
${o.notes?`<p style="margin-top:14px"><small><b>Note:</b> ${e(o.notes)}</small></p>`:''}
<div class="ft"><b>Thank you for choosing Bhavnaben Khakhrawala 🙏</b>Baking tradition since 1998 · This is a computer generated bill.</div></div></div>`;
 if(Q.get('print')=='1')setTimeout(print,600);
}catch(x){$('#msg').innerHTML='<h2>Bill not found</h2><p style="margin-top:8px">This bill link is invalid or has expired. Please contact us on +91 99255 20051.</p>'}})();
</script></body></html>
