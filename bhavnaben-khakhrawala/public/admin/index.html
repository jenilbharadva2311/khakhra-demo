<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BK Admin</title>
<style>[hidden]{display:none!important}*{box-sizing:border-box;margin:0}body{font:14px/1.5 system-ui,sans-serif;background:#f6f1e6;color:#2a1a10}header{background:#3b2113;color:#fff;padding:10px 4%;display:flex;gap:6px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5}header b{margin-right:auto;color:#ffc21a}button,select,input{font:inherit;padding:8px 12px;border:1px solid #ccc;border-radius:10px;background:#fff}button{cursor:pointer;background:#f26a1b;color:#fff;border:0}button.g{background:#eee;color:#333}button.r{background:#c0392b}header button{background:#ffffff22;text-transform:capitalize}header button.on{background:#ffc21a;color:#3b2113}main{padding:16px 4%;max-width:1100px;margin:auto}.c{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0001;display:block}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chip{display:inline-flex;gap:6px;border:1px solid #ccc;border-radius:99px;padding:3px 10px;margin:3px;cursor:pointer}.chip.x{background:#fde2de;text-decoration:line-through}.chip u{text-decoration:none;color:#c0392b}.bar{height:12px;background:#f26a1b;border-radius:6px}.new{background:#ffc21a;padding:1px 8px;border-radius:9px}#lg{max-width:340px;margin:12vh auto;padding:20px}#lg input{width:100%;margin:6px 0}h4{margin:10px 0 2px}</style></head><body>
<form id="lg" class="c" onsubmit="login(event)"><h2>BK Admin Login</h2><input id="em" type="email" placeholder="Email" required><input id="pw" type="password" placeholder="Password" required><button style="width:100%">Login</button></form>
<div id="app" hidden><header><b>Bhavnaben Khakhrawala</b><span id="nav"></span><button onclick="P('logout').then(()=>{U=null;show()})">Logout</button></header><main id="v"></main></div>
<script>
let U,T='orders',O=[];const $=s=>document.querySelector(s),V={},e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=(act,o={})=>fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({act,...o})}).then(r=>{if(r.status==401){U=null;show();throw 0}if(!r.ok){alert(r.status==403?'Admin only':'Something went wrong');throw 0}return r.json()});
const rs=f=>new Promise(r=>{if(!f)return r('');const i=new Image;i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=URL.createObjectURL(f)});
async function login(ev){ev.preventDefault();const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({act:'login',email:$('#em').value,password:$('#pw').value})});if(!r.ok)return alert('Wrong email or password');U=await r.json();show()}
function show(){$('#lg').hidden=!!U;$('#app').hidden=!U;if(U)load()}
function load(){const t=['orders','stats','products','reviews','wholesale'];if(U.role=='admin')t.push('staff');$('#nav').innerHTML=t.map(x=>`<button class="${x==T?'on':''}" onclick="T='${x}';load()">${x}</button>`).join('');V[T]()}
async function go(a,o){await P(a,o);load()}const tg=(t,id,v)=>go('tog',{t,id,v});
const wa=p=>{const d=String(p||'').replace(/\D/g,'').slice(-10);return d.length==10?`<a target="_blank" href="https://wa.me/91${d}"><button class="g">WhatsApp</button></a>`:''};
const flt=v=>document.querySelectorAll('.oc').forEach(c=>c.style.display=c.textContent.toLowerCase().includes(v.toLowerCase())?'':'none');
function clr(t){if(prompt('This permanently deletes ALL '+t+'. Type DELETE to confirm')=='DELETE')go('clear',{t,confirm:'DELETE'})}
V.orders=async()=>{O=await P('orders');const A=U.role=='admin';$('#v').innerHTML=`<div class="row"><button onclick="mf()">+ Manual order</button>${A?`<a href="/api/export"><button class="g">Download CSV</button></a><button class="r" onclick="clr('orders')">Delete ALL orders</button>`:''}<input placeholder="Search name / phone / order no" oninput="flt(this.value)" style="flex:1;min-width:200px"></div><div id="mform" class="c" hidden></div>`+(O.map((x,n)=>`<div class="c oc"><div class="row"><b>${e(x.order_no)}</b>${x.status=='new'?'<span class="new">NEW</span>':''}${x.source=='manual'?'<span class="new" style="background:#cde">MANUAL</span>':''}<small>${e(x.created_at)} UTC</small><select onchange="go('status',{id:${x.id},v:this.value})">${['new','packed','shipped','delivered','cancelled'].map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select>${x.source=='manual'?'':`<button class="g" onclick="lab(${n})">Print label</button>`}${wa(x.phone)}${A?`<button class="r" onclick="if(confirm('Delete this order?'))go('delO',{id:${x.id}})">Delete</button>`:''}</div><p><b>${e(x.name)}</b> ${e(x.phone)}<br>${e(x.address)} ${e(x.city)} ${e(x.pincode)}${x.notes?'<br><i>'+e(x.notes)+'</i>':''}</p><p>${x.items.map(i=>`• ${e(i.product_name)} · ${e(i.flavour)} · ${e(i.size_label)} × ${i.qty}`).join('<br>')}</p></div>`).join('')||'<p>No orders yet.</p>')};
async function mf(){const p=await P('prods'),u=a=>[...new Set(a)].map(x=>`<option value="${e(x)}">`).join('');const m=$('#mform');m.hidden=false;m.innerHTML=`<datalist id="dp">${u(p.map(x=>x.name))}</datalist><datalist id="df">${u(p.flatMap(x=>x.fl.map(f=>f.name)))}</datalist><datalist id="dz">${u(p.flatMap(x=>x.sizes.map(z=>z.label)))}</datalist><h3>Manual / walk-in order</h3><p><small>Type or pick product, flavour and size. It is counted in all totals.</small></p><div class="row"><input id="mn" placeholder="Customer name"><input id="mp" placeholder="Phone (optional)"><input id="md" type="date"><select id="ms"><option>delivered</option><option>new</option><option>packed</option><option>shipped</option></select><input id="mt" placeholder="Note (optional)"></div><div id="mlines"></div><div class="row"><button class="g" onclick="addLine()">+ Add item</button><button onclick="msave()">Save order</button></div>`;addLine()}
function addLine(){$('#mlines').insertAdjacentHTML('beforeend','<div class="row il" style="margin:6px 0"><input list="dp" placeholder="Product" class="a"><input list="df" placeholder="Flavour" class="b"><input list="dz" placeholder="Size" class="c" style="width:90px"><input type="number" min="1" value="1" class="d" style="width:70px"></div>')}
async function msave(){const it=[...document.querySelectorAll('.il')].map(r=>({product:r.querySelector('.a').value.trim(),flavour:r.querySelector('.b').value.trim(),size:r.querySelector('.c').value.trim(),qty:+r.querySelector('.d').value||1})).filter(x=>x.product&&x.flavour);if(!it.length)return alert('Add at least one item with product and flavour');await go('manual',{name:$('#mn').value,phone:$('#mp').value,date:$('#md').value,status:$('#ms').value,notes:$('#mt').value,items:it})}
function lab(n){const x=O[n],w=open('','_blank');w.document.write(`<body style="font:16px sans-serif;width:380px;border:2px solid #000;padding:14px"><h2>Bhavnaben Khakhrawala</h2><small>Amroli, Surat - 394107 · +91 99255 20051</small><hr><b>TO:</b><br><big>${e(x.name)}</big><br>${e(x.address)}<br>${e(x.city)} - ${e(x.pincode)}<br>Phone: ${e(x.phone)}<hr>Order: ${e(x.order_no)}<br>${x.items.map(i=>`${e(i.product_name)} ${e(i.flavour)} ${e(i.size_label)} x ${i.qty}`).join('<br>')}</body>`);w.document.close();w.print()}
V.stats=async()=>{const s=await P('stats'),t=(a,h)=>{const mx=Math.max(1,...a.map(r=>r.packs));return`<div class="c"><h3>${h}</h3>${a.map(r=>`<div class="row"><span style="width:150px">${e(r.k)}</span><div class="bar" style="width:${r.packs/mx*40}%"></div><span>${r.packs} packs${r.orders!=null?' · '+r.orders+' orders':''}</span></div>`).join('')||'No data yet'}</div>`};$('#v').innerHTML=t(s.m,'Monthly sales')+t(s.y,'Yearly sales')+t(s.top,'Top 10 flavours')};
const chip=(t,o)=>`<span class="chip ${o.in_stock?'':'x'}" onclick="tg('${t}',${o.id},${o.in_stock?0:1})">${e(o.name||o.label)}${U.role=='admin'?`<u onclick="event.stopPropagation();if(confirm('Remove?'))go('${t=='f'?'delF':'delS'}',{id:${o.id}})">✕</u>`:''}</span>`;
V.products=async()=>{const op=[...document.querySelectorAll('details[open]')].map(d=>d.dataset.i),p=await P('prods'),A=U.role=='admin';$('#v').innerHTML=(A?`<div class="c"><h3>Add product</h3><div class="row"><input id="pn" placeholder="Name"><input id="pd" placeholder="Description"><input id="ps" placeholder="Sizes e.g. 200g,500g"><input id="ph" placeholder="Shelf life e.g. 45 days"><input type="file" id="pi" accept="image/*"><button onclick="addP()">Add</button></div></div>`:'')+p.map(x=>`<details class="c" data-i="${x.id}" ${op.includes(''+x.id)?'open':''}><summary><b>${e(x.name)}</b> ${x.in_stock?'':'(OUT OF STOCK)'} · ${x.fl.length} flavours</summary><div class="row" style="margin:8px 0"><button class="g" onclick="tg('p',${x.id},${x.in_stock?0:1})">${x.in_stock?'Mark out of stock':'Mark in stock'}</button>${A?`<button class="r" onclick="if(confirm('Delete whole product?'))go('delP',{id:${x.id}})">Delete product</button>`:''}</div><h4>Sizes (tap = stock on/off)</h4>${x.sizes.map(z=>chip('z',z)).join('')}${A?`<input id="sz${x.id}" placeholder="e.g. 500g" style="width:100px"><button onclick="go('addS',{pid:${x.id},label:$('#sz${x.id}').value})">Add size</button>`:''}<h4>Flavours (tap = stock on/off)</h4>${x.fl.map(f=>chip('f',f)).join('')}${A?`<div class="row"><input id="fn${x.id}" placeholder="New flavour"><input id="fg${x.id}" placeholder="Group"><input type="file" id="ff${x.id}" accept="image/*"><button onclick="addF(${x.id})">Add flavour</button></div>`:''}</details>`).join('')};
async function addP(){if(!$('#pn').value)return alert('Enter name');go('addP',{name:$('#pn').value,desc:$('#pd').value,sizes:$('#ps').value,shelf:$('#ph').value,image:await rs($('#pi').files[0])})}
async function addF(i){if(!$('#fn'+i).value)return alert('Enter flavour name');go('addF',{pid:i,name:$('#fn'+i).value,grp:$('#fg'+i).value,image:await rs($('#ff'+i).files[0])})}
V.reviews=async()=>{const r=await P('revs'),A=U.role=='admin';$('#v').innerHTML=(A?`<button class="r" onclick="clr('reviews')">Delete ALL reviews</button>`:'')+(r.map(x=>`<div class="c"><div class="row"><b>${e(x.name)}</b> ${e(x.city)} · ${'★'.repeat(x.rating)} <span class="${x.status=='pending'?'new':''}">${x.status}</span></div><p>${e(x.body)}</p>${x.image?`<img src="${e(x.image)}" style="max-height:120px">`:''}<div class="row"><button onclick="go('rev',{id:${x.id},v:'approved'})">Approve</button><button class="g" onclick="go('rev',{id:${x.id},v:'rejected'})">Reject</button>${A?`<button class="r" onclick="if(confirm('Delete?'))go('rev',{id:${x.id},v:'delete'})">Delete</button>`:''}</div></div>`).join('')||'No reviews yet.')};
V.wholesale=async()=>{const r=await P('ws'),A=U.role=='admin';$('#v').innerHTML=(A?`<button class="r" onclick="clr('wholesale')">Delete ALL inquiries</button>`:'')+(r.map(x=>`<div class="c"><div class="row"><b>${e(x.business_name)}</b> · ${e(x.contact_name)} · ${e(x.phone)} · ${e(x.city)}<select onchange="go('wst',{id:${x.id},v:this.value})">${['new','contacted','closed'].map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select>${A?`<button class="r" onclick="if(confirm('Delete?'))go('delWs',{id:${x.id}})">Delete</button>`:''}</div><p>${e(x.business_type)} · ${e(x.products_interested)} · ${e(x.monthly_qty)}<br>${e(x.message)}</p></div>`).join('')||'None yet.')};
V.staff=async()=>{const r=await P('users');$('#v').innerHTML=`<div class="c"><h3>Add user</h3><div class="row"><input id="ue" placeholder="Email"><input id="un" placeholder="Name"><input id="up" placeholder="Password (min 6)"><select id="ur"><option>staff</option><option>admin</option></select><button onclick="go('addU',{email:$('#ue').value,name:$('#un').value,password:$('#up').value,role:$('#ur').value})">Add</button></div></div>`+r.map(x=>`<div class="c">${e(x.name)} · ${e(x.email)} · <b>${x.role}</b> <button class="r" onclick="if(confirm('Remove user?'))go('delU',{id:${x.id}})">Remove</button></div>`).join('')};
P('me').then(u=>{U=u;show()}).catch(()=>{});
</script></body></html>
