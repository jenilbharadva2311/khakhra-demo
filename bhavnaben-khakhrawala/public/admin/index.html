<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BK Admin</title>
<style>[hidden]{display:none!important}*{box-sizing:border-box;margin:0}body{font:14px/1.5 system-ui,sans-serif;background:#f6f1e6;color:#2a1a10}header{background:#3b2113;color:#fff;padding:10px 4%;display:flex;gap:6px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5}header b{margin-right:auto;color:#ffc21a;display:flex;align-items:center;gap:10px}header b img{height:34px;width:auto;background:#fff;border-radius:8px;padding:2px 6px}.tb{width:100%;border-collapse:collapse}.tb th,.tb td{padding:7px 8px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.ok{color:#1b7a3a;font-weight:600}.off{color:#c0392b;font-weight:600}.tot{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:#fff7e3;border-radius:10px;padding:8px 12px}.dsc{color:#1b7a3a;font-weight:600}.cpn{display:inline-block;background:#e6f4ea;color:#1b7a3a;border:1px dashed #1b7a3a;border-radius:6px;padding:0 8px;font-size:12px}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}.kp>div{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 2px 8px #0001}.kp b{display:block;font-size:20px;color:#3b2113}.kp span{font-size:12px;color:#777}.kp .hl{background:#3b2113}.kp .hl b{color:#ffc21a}.kp .hl span{color:#fff9}.badge{display:inline-block;border-radius:99px;padding:0 9px;font-size:11px;font-weight:600;background:#e6f4ea;color:#1b7a3a}.badge.n{background:#ffe9b0;color:#7a5a00}.badge.x{background:#fde2de;color:#c0392b}.dbar{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px}.dbar div{flex:1;background:#f26a1b;border-radius:4px 4px 0 0;min-height:2px;position:relative}.dbar div:hover{background:#c0392b}.dl{display:flex;gap:3px;font-size:10px;color:#777}.dl span{flex:1;text-align:center}.bni{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.bni img{width:240px;max-width:100%;height:90px;object-fit:cover;border-radius:10px;background:#eee}.bni.off img{opacity:.4}.fl label{display:block;font-size:12px;color:#666;margin:2px 0}.fl>div{flex:1;min-width:130px}.fl input,.fl select{width:100%}button,select,input{font:inherit;padding:8px 12px;border:1px solid #ccc;border-radius:10px;background:#fff}button{cursor:pointer;background:#f26a1b;color:#fff;border:0}button.g{background:#eee;color:#333}button.r{background:#c0392b}header button{background:#ffffff22;text-transform:capitalize}header button.on{background:#ffc21a;color:#3b2113}main{padding:16px 4%;max-width:1100px;margin:auto}.c{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0001;display:block}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chip{display:inline-flex;gap:6px;border:1px solid #ccc;border-radius:99px;padding:3px 10px;margin:3px;cursor:pointer}.chip.x{background:#fde2de;text-decoration:line-through}.chip u{text-decoration:none;color:#c0392b}.bar{height:12px;background:#f26a1b;border-radius:6px}.new{background:#ffc21a;padding:1px 8px;border-radius:9px}#lg{max-width:340px;margin:12vh auto;padding:20px}#lg input{width:100%;margin:6px 0}h4{margin:10px 0 2px}</style></head><body>
<form id="lg" class="c" onsubmit="login(event)"><h2>BK Admin Login</h2><input id="em" type="email" placeholder="Email" required><input id="pw" type="password" placeholder="Password" required><button style="width:100%">Login</button></form>
<div id="app" hidden><header><b><img src="/images/logo.png" alt="">Admin</b><span id="nav"></span><button onclick="P('logout').then(()=>{U=null;show()})">Logout</button></header><main id="v"></main></div>
<script>
let U,T='orders',O=[];const $=s=>document.querySelector(s),V={},e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=(act,o={})=>fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({act,...o})}).then(r=>{if(r.status==401){U=null;show();throw 0}if(!r.ok){alert(r.status==403?'Admin only':'Something went wrong');throw 0}return r.json()});
const rs=f=>new Promise(r=>{if(!f)return r('');const i=new Image;i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=URL.createObjectURL(f)});
async function login(ev){ev.preventDefault();const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({act:'login',email:$('#em').value,password:$('#pw').value})});if(!r.ok)return alert('Wrong email or password');U=await r.json();show()}
function show(){$('#lg').hidden=!!U;$('#app').hidden=!U;if(U)load()}
function load(){const t=['orders','stats','customers','products','reviews','wholesale'];if(U.role=='admin')t.splice(4,0,'prices','coupons','banners'),t.push('staff');$('#nav').innerHTML=t.map(x=>`<button class="${x==T||(x=='stats'&&T=='month')?'on':''}" onclick="T='${x}';load()">${x}</button>`).join('');V[T]()}
async function go(a,o){await P(a,o);load()}const tg=(t,id,v)=>go('tog',{t,id,v});
const wn=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length==12&&d.startsWith('91'))return d;if(d.length==11&&d[0]=='0')d=d.slice(1);return d.length>=10?'91'+d.slice(-10):''};
const wt=t=>String(t==null?'':t).replace(/[*_~`]/g,'').replace(/\s*\n\s*/g,', ').trim(),R=n=>'₹'+(+n).toLocaleString('en-IN'),kc=n=>n<10?n+'\uFE0F\u20E3':n+'.';
function waMsg(x){const d=new Date(String(x.created_at).replace(' ','T')+'Z'),it=x.items||[],tot=it.reduce((a,i)=>a+(i.price||0)*i.qty,0),L=['🙏 *Namaste '+wt(x.name)+'!*','Thank you for ordering from *Bhavnaben Khakhrawala* 🌾','━━━━━━━━━━━━━━','🧾 *Order No:* '+x.order_no,'📅 *Date:* '+d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'}),'📌 *Status:* '+x.status,'','📦 *YOUR ORDER*'];
it.forEach((i,n)=>L.push(kc(n+1)+' *'+wt(i.product_name)+'* – '+wt(i.flavour),'      '+wt(i.size_label)+(i.vac?' (Vacuum)':'')+' × '+i.qty+(i.price!=null?' @ '+R(i.price)+' = *'+R(i.price*i.qty)+'*':'')));
L.push('━━━━━━━━━━━━━━');if(x.discount>0)L.push('🧮 *Subtotal:* '+R(x.subtotal),'🎟️ *Coupon'+(x.coupon?' ('+wt(x.coupon)+')':'')+':* − '+R(x.discount));if(x.total)L.push('💰 *TOTAL: '+R(x.total)+'*');if(x.address)L.push('📍 *Delivery to:* '+wt(x.address)+(x.city?', '+wt(x.city):'')+(x.pincode?' - '+wt(x.pincode):''));L.push('','🧾 *View / download your bill:*',location.origin+'/bill.html?no='+x.order_no+'&t='+x.tok,'','_Thank you for choosing us!_ 🙏','*Bhavnaben Khakhrawala* · Since 1998');return L.join('\n')}
const wa=x=>{const d=wn(x.phone);return d?`<a target="_blank" href="https://wa.me/${d}?text=${encodeURIComponent(waMsg(x))}"><button style="background:#25d366">WhatsApp</button></a>`:''};
const inv=(x,pr)=>`/bill.html?no=${x.order_no}&t=${x.tok}${pr?'&print=1':''}`;
const flt=()=>{const v=($('#oq')||{value:''}).value.toLowerCase(),s=($('#os')||{value:''}).value;document.querySelectorAll('.oc').forEach(c=>c.style.display=(!v||c.textContent.toLowerCase().includes(v))&&(!s||c.dataset.s==s)?'':'none')};
const NX={new:'packed',packed:'shipped',shipped:'delivered'},nx=x=>NX[x.status]?`<button onclick="go('status',{id:${x.id},v:'${NX[x.status]}'})">→ ${NX[x.status]}</button>`:'';
const fdt=d=>new Date(String(d).replace(' ','T')+'Z').toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'}),mname=k=>new Date(k+'-15').toLocaleString('en-IN',{month:'long',year:'numeric'}),shm=(k,d)=>{const x=new Date(k+'-15');x.setMonth(x.getMonth()+d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};
let MON=new Date(Date.now()+19800000).toISOString().slice(0,7),LP=null;
function dl(n,rows){const c=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(r=>r.map(c).join(',')).join('\n')],{type:'text/csv'}));a.download=n;a.click()}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),250)}catch(e){}}
function clr(t){if(prompt('This permanently deletes ALL '+t+'. Type DELETE to confirm')=='DELETE')go('clear',{t,confirm:'DELETE'})}
V.orders=async()=>{O=await P('orders');const A=U.role=='admin';$('#v').innerHTML=`<div class="row"><button onclick="mf()">+ Manual order</button>${A?`<a href="/api/export"><button class="g">Download CSV</button></a><button class="r" onclick="clr('orders')">Delete ALL orders</button>`:''}<input placeholder="Search name / phone / order no" id="oq" oninput="flt()" style="flex:1;min-width:200px"><select id="os" onchange="flt()"><option value="">All status</option>${['new','packed','shipped','delivered','cancelled'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="kp" id="dash"></div><div id="mform" class="c" hidden></div>`+(O.map((x,n)=>`<div class="c oc" data-s="${x.status}"><div class="row"><b>${e(x.order_no)}</b>${x.status=='new'?'<span class="new">NEW</span>':''}${x.source=='manual'?'<span class="new" style="background:#cde">MANUAL</span>':''}<small>${e(x.created_at)} UTC</small><select onchange="go('status',{id:${x.id},v:this.value})">${['new','packed','shipped','delivered','cancelled'].map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select>${nx(x)}${x.source=='manual'?'':`<button class="g" onclick="lab(${n})">Print label</button>`}<a target="_blank" href="${inv(x)}"><button class="g">🧾 Invoice</button></a><a target="_blank" href="${inv(x,1)}"><button class="g">🖨️ Print</button></a>${wa(x)}${A?`<button class="r" onclick="if(confirm('Delete this order?'))go('delO',{id:${x.id}})">Delete</button>`:''}</div><p><b>${e(x.name)}</b> ${e(x.phone)}<br>${e(x.address)} ${e(x.city)} ${e(x.pincode)}${x.notes?'<br><i>'+e(x.notes)+'</i>':''}</p><p>${x.items.map(i=>`• ${e(i.product_name)} · ${e(i.flavour)} · ${e(i.size_label)}${i.vac?' (Vacuum)':''} × ${i.qty}${i.price!=null?' @ ₹'+i.price+' = ₹'+(i.price*i.qty):''}`).join('<br>')}</p><div class="tot"><span>Subtotal: <b>${R(x.subtotal)}</b></span>${x.discount>0?`<span class="dsc">Discount: − ${R(x.discount)} ${x.coupon?`<span class="cpn">${e(x.coupon)}</span>`:''}</span>`:''}<span style="margin-left:auto;font-size:16px">Total: <b>${R(x.total)}</b></span></div></div>`).join('')||'<p>No orders yet.</p>');P('dash').then(d=>{LP=d.pending;$('#dash').innerHTML=`<div><b>${d.today.n}</b><span>Orders today · ${R(d.today.amt)}</span></div><div class="hl"><b>${d.pending}</b><span>New orders to pack</span></div><div><b>${R(d.month.amt)}</b><span>This month · ${d.month.n} orders</span></div>`}).catch(()=>{})};
async function mf(){const p=await P('prods'),u=a=>[...new Set(a)].map(x=>`<option value="${e(x)}">`).join('');const m=$('#mform');m.hidden=false;m.innerHTML=`<datalist id="dp">${u(p.map(x=>x.name))}</datalist><datalist id="df">${u(p.flatMap(x=>x.fl.map(f=>f.name)))}</datalist><datalist id="dz">${u(p.flatMap(x=>x.sizes.map(z=>z.label)))}</datalist><h3>Manual / walk-in order</h3><p><small>Type or pick product, flavour and size. It is counted in all totals.</small></p><div class="row"><input id="mn" placeholder="Customer name"><input id="mp" placeholder="Phone (optional)"><input id="md" type="date"><select id="ms"><option>delivered</option><option>new</option><option>packed</option><option>shipped</option></select><input id="mt" placeholder="Note (optional)"><input id="mc" placeholder="Coupon code (optional)" style="text-transform:uppercase"></div><div id="mlines"></div><div class="row"><button class="g" onclick="addLine()">+ Add item</button><button onclick="msave()">Save order</button></div>`;addLine()}
function addLine(){$('#mlines').insertAdjacentHTML('beforeend','<div class="row il" style="margin:6px 0"><input list="dp" placeholder="Product" class="a"><input list="df" placeholder="Flavour" class="b"><input list="dz" placeholder="Size" class="c" style="width:90px"><input type="number" min="1" value="1" class="d" style="width:70px"></div>')}
async function msave(){const it=[...document.querySelectorAll('.il')].map(r=>({product:r.querySelector('.a').value.trim(),flavour:r.querySelector('.b').value.trim(),size:r.querySelector('.c').value.trim(),qty:+r.querySelector('.d').value||1})).filter(x=>x.product&&x.flavour);if(!it.length)return alert('Add at least one item with product and flavour');await go('manual',{name:$('#mn').value,phone:$('#mp').value,date:$('#md').value,status:$('#ms').value,notes:$('#mt').value,coupon:$('#mc').value,items:it})}
function lab(n){const x=O[n],w=open('','_blank');w.document.write(`<body style="font:16px sans-serif;width:380px;border:2px solid #000;padding:14px"><h2>Bhavnaben Khakhrawala</h2><small>Amroli, Surat - 394107 · +91 99255 20051</small><hr><b>TO:</b><br><big>${e(x.name)}</big><br>${e(x.address)}<br>${e(x.city)} - ${e(x.pincode)}<br>Phone: ${e(x.phone)}<hr>Order: ${e(x.order_no)}<br>${x.items.map(i=>`${e(i.product_name)} ${e(i.flavour)} ${e(i.size_label)} x ${i.qty}`).join('<br>')}</body>`);w.document.close();w.print()}
V.stats=async()=>{const s=await P('stats'),t=(a,h)=>{const mx=Math.max(1,...a.map(r=>r.packs));return`<div class="c"><h3>${h}</h3>${a.map(r=>`<div class="row"><span style="width:150px">${e(r.k)}</span><div class="bar" style="width:${r.packs/mx*40}%"></div><span>${r.packs} packs${r.orders!=null?' · '+r.orders+' orders':''}</span></div>`).join('')||'No data yet'}</div>`};$('#v').innerHTML=`<div class="c"><h3>Monthly revenue (after discounts)</h3><p><small>Tap a month to see every order, every customer and the amount.</small></p><table class="tb"><tr><th>Month</th><th>Orders</th><th>Revenue</th><th>Discount given</th><th></th></tr>${(s.rev||[]).map(r=>`<tr style="cursor:pointer" onclick="MON='${r.k}';T='month';load()"><td><b>${mname(r.k)}</b></td><td>${r.orders}</td><td><b>${R(r.amt||0)}</b></td><td>${r.dis?R(r.dis):'-'}</td><td><button>View full month →</button></td></tr>`).join('')||'<tr><td colspan=5>No data yet</td></tr>'}</table></div>`+t(s.m,'Monthly sales')+t(s.y,'Yearly sales')+t(s.top,'Top 10 flavours')};
const chip=(t,o)=>`<span class="chip ${o.in_stock?'':'x'}" onclick="tg('${t}',${o.id},${o.in_stock?0:1})">${e(o.name||o.label)}${U.role=='admin'?`<u onclick="event.stopPropagation();if(confirm('Remove?'))go('${t=='f'?'delF':'delS'}',{id:${o.id}})">✕</u>`:''}</span>`;
V.products=async()=>{const op=[...document.querySelectorAll('details[open]')].map(d=>d.dataset.i),p=await P('prods'),A=U.role=='admin';$('#v').innerHTML=(A?`<div class="c"><h3>Add product</h3><div class="row"><input id="pn" placeholder="Name"><input id="pd" placeholder="Description"><input id="ps" placeholder="Sizes e.g. 200g,500g"><input id="ph" placeholder="Shelf life e.g. 45 days"><input type="file" id="pi" accept="image/*"><button onclick="addP()">Add</button></div></div>`:'')+p.map(x=>`<details class="c" data-i="${x.id}" ${op.includes(''+x.id)?'open':''}><summary><b>${e(x.name)}</b> ${x.in_stock?'':'(OUT OF STOCK)'} · ${x.fl.length} flavours</summary><div class="row" style="margin:8px 0"><button class="g" onclick="tg('p',${x.id},${x.in_stock?0:1})">${x.in_stock?'Mark out of stock':'Mark in stock'}</button>${A?`<button class="r" onclick="if(confirm('Delete whole product?'))go('delP',{id:${x.id}})">Delete product</button>`:''}</div><h4>Sizes (tap = stock on/off)</h4>${x.sizes.map(z=>chip('z',z)).join('')}${A?`<input id="sz${x.id}" placeholder="e.g. 500g" style="width:100px"><button onclick="go('addS',{pid:${x.id},label:$('#sz${x.id}').value})">Add size</button>`:''}${A?`<h4>Photo</h4><div class="row"><input type="file" id="pp${x.id}" accept="image/*"><button onclick="setImg('p',${x.id},'pp${x.id}')">Change product photo</button></div><div class="row" style="margin-top:6px"><select id="fs${x.id}">${x.fl.map(f=>`<option value="${f.id}">${e(f.name)}</option>`).join('')}</select><input type="file" id="fp${x.id}" accept="image/*"><button onclick="setImg('f',$('#fs${x.id}').value,'fp${x.id}')">Change flavour photo</button></div>`:''}<h4>Flavours (tap = stock on/off)</h4>${x.fl.map(f=>chip('f',f)).join('')}${A?`<div class="row"><input id="fn${x.id}" placeholder="New flavour"><input id="fg${x.id}" placeholder="Group"><input type="file" id="ff${x.id}" accept="image/*"><button onclick="addF(${x.id})">Add flavour</button></div>`:''}</details>`).join('')};
async function addP(){if(!$('#pn').value)return alert('Enter name');go('addP',{name:$('#pn').value,desc:$('#pd').value,sizes:$('#ps').value,shelf:$('#ph').value,image:await rs($('#pi').files[0])})}
async function addF(i){if(!$('#fn'+i).value)return alert('Enter flavour name');go('addF',{pid:i,name:$('#fn'+i).value,grp:$('#fg'+i).value,image:await rs($('#ff'+i).files[0])})}
async function setImg(t,id,inp){const f=$('#'+inp).files[0];if(!f)return alert('Choose a photo first');await go('setImg',{t,id,image:await rs(f)});alert('Photo updated')}
V.prices=async()=>{const p=await P('prices');$('#v').innerHTML='<div class="c"><h3>Prices (₹)</h3><p><small>Fill Price and Vacuum price for each size. Leave Vacuum empty if there is no vacuum pack (customer will not see it). Leave Price empty to show "Price not set yet" and block ordering.</small></p></div>'+p.map(x=>{const g=x.groups.length?x.groups:['Classic'];return`<div class="c" data-pid="${x.id}"><h3>${e(x.name)}</h3><div style="overflow:auto"><table style="border-collapse:collapse;width:100%"><tr><th align="left">Group</th>${x.sizes.map(z=>`<th>${e(z)}<br><small>Price / Vacuum</small></th>`).join('')}</tr>${g.map(gr=>`<tr style="border-top:1px solid #eee"><td><b>${e(gr)}</b></td>${x.sizes.map(z=>{const r=x.pr.find(y=>y.grp==gr&&y.size_label==z)||{};return`<td align="center"><input class="pi" data-g="${e(gr)}" data-z="${e(z)}" data-k="p" type="number" min="0" step="0.5" value="${r.price==null?'':r.price}" placeholder="₹" style="width:80px"> <input class="pi" data-g="${e(gr)}" data-z="${e(z)}" data-k="v" type="number" min="0" step="0.5" value="${r.vac_price==null?'':r.vac_price}" placeholder="Vac ₹" style="width:80px"></td>`}).join('')}</tr>`).join('')}</table></div><br><button onclick="savePr(this)">Save ${e(x.name)} prices</button></div>`}).join('')};
async function savePr(b){const c=b.closest('.c'),m={};c.querySelectorAll('.pi').forEach(i=>{const k=i.dataset.g+'|'+i.dataset.z;m[k]=m[k]||{pid:c.dataset.pid,grp:i.dataset.g,label:i.dataset.z};m[k][i.dataset.k=='p'?'price':'vac']=i.value});await P('savePrices',{rows:Object.values(m)});alert('Prices saved')}
V.reviews=async()=>{const r=await P('revs'),A=U.role=='admin';$('#v').innerHTML=(A?`<button class="r" onclick="clr('reviews')">Delete ALL reviews</button>`:'')+(r.map(x=>`<div class="c"><div class="row"><b>${e(x.name)}</b> ${e(x.city)} · ${'★'.repeat(x.rating)} <span class="${x.status=='pending'?'new':''}">${x.status}</span></div><p>${e(x.body)}</p>${x.image?`<img src="${e(x.image)}" style="max-height:120px">`:''}<div class="row"><button onclick="go('rev',{id:${x.id},v:'approved'})">Approve</button><button class="g" onclick="go('rev',{id:${x.id},v:'rejected'})">Reject</button>${A?`<button class="r" onclick="if(confirm('Delete?'))go('rev',{id:${x.id},v:'delete'})">Delete</button>`:''}</div></div>`).join('')||'No reviews yet.')};
V.wholesale=async()=>{const r=await P('ws'),A=U.role=='admin';$('#v').innerHTML=(A?`<button class="r" onclick="clr('wholesale')">Delete ALL inquiries</button>`:'')+(r.map(x=>`<div class="c"><div class="row"><b>${e(x.business_name)}</b> · ${e(x.contact_name)} · ${e(x.phone)} · ${e(x.city)}<select onchange="go('wst',{id:${x.id},v:this.value})">${['new','contacted','closed'].map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select>${A?`<button class="r" onclick="if(confirm('Delete?'))go('delWs',{id:${x.id}})">Delete</button>`:''}</div><p>${e(x.business_type)} · ${e(x.products_interested)} · ${e(x.monthly_qty)}<br>${e(x.message)}</p></div>`).join('')||'None yet.')};
V.coupons=async()=>{const c=await P('coupons'),f=x=>(x.type=='flat'?R(x.value)+' flat':x.value+'%'+(x.max_discount?' (max '+R(x.max_discount)+')':''));window.CP=c;
$('#v').innerHTML=`<div class="c" id="cf"></div><div class="c"><h3>All coupons</h3><div style="overflow:auto"><table class="tb"><tr><th>Code</th><th>Discount</th><th>Min order</th><th>Used</th><th>Per customer</th><th>Expiry</th><th>Status</th><th></th></tr>${c.map((x,n)=>`<tr><td><span class="cpn">${e(x.code)}</span><br><small>${e(x.note||'')}</small></td><td><b>${f(x)}</b></td><td>${x.min_order?R(x.min_order):'-'}</td><td>${x.used}${x.max_uses?' / '+x.max_uses:' / ∞'}</td><td>${x.per_customer==0?'Unlimited':x.per_customer+' time'+(x.per_customer>1?'s':'')}</td><td>${x.expires||'-'}</td><td class="${x.active?'ok':'off'}">${x.active?'Active':'Inactive'}</td><td style="white-space:nowrap"><button class="${x.active?'g':''}" onclick="go('togC',{id:${x.id},v:${x.active?0:1}})">${x.active?'Make inactive':'Activate'}</button> <button class="g" onclick="cEdit(${n})">Edit</button> <button class="r" onclick="if(confirm('Delete this coupon?'))go('delC',{id:${x.id}})">Delete</button></td></tr>`).join('')||'<tr><td colspan=8>No coupons yet. Create the first one above.</td></tr>'}</table></div></div>`;cEdit(-1)};
function cEdit(n){const x=n>=0?CP[n]:{type:'percent',per_customer:1};$('#cf').innerHTML=`<h3>${n>=0?'Edit coupon '+e(x.code):'Create new coupon'}</h3><div class="row fl"><div><label>Coupon code *</label><input id="cc" value="${e(x.code||'')}" placeholder="e.g. DIWALI10" style="text-transform:uppercase"></div><div><label>Discount type *</label><select id="ct"><option value="percent" ${x.type!='flat'?'selected':''}>Percentage (%)</option><option value="flat" ${x.type=='flat'?'selected':''}>Flat amount (₹)</option></select></div><div><label>Discount value *</label><input id="cv" type="number" min="0" step="0.5" value="${x.value==null?'':x.value}" placeholder="10 or 50"></div><div><label>Minimum order (₹)</label><input id="cm" type="number" min="0" value="${x.min_order||''}" placeholder="0 = none"></div></div><div class="row fl" style="margin-top:6px"><div><label>Total uses allowed (all customers)</label><input id="cu" type="number" min="0" value="${x.max_uses||''}" placeholder="empty = unlimited"></div><div><label>Uses per customer (phone no.)</label><input id="cp" type="number" min="0" value="${x.per_customer==null?1:x.per_customer}" placeholder="1 = once, 0 = unlimited"></div><div><label>Max discount cap (₹, % only)</label><input id="cx" type="number" min="0" value="${x.max_discount||''}" placeholder="optional"></div><div><label>Expiry date (optional)</label><input id="ce" type="date" value="${x.expires||''}"></div><div><label>Note (for you)</label><input id="cn" value="${e(x.note||'')}" placeholder="optional"></div></div><div class="row" style="margin-top:10px"><button onclick="cSave(${n>=0?x.id:0})">${n>=0?'Save changes':'Create coupon'}</button>${n>=0?'<button class="g" onclick="cEdit(-1)">Cancel</button>':''}</div><p><small>Once per customer: set "Uses per customer" to 1. Custom limit: any number. Switch any coupon Inactive from the list below whenever you want.</small></p>`}
async function cSave(id){if(!$('#cc').value.trim()||!$('#cv').value)return alert('Enter coupon code and discount value');if($('#ct').value=='percent'&&+$('#cv').value>100)return alert('Percentage cannot be above 100');try{await P('saveCoupon',{id,code:$('#cc').value,type:$('#ct').value,value:$('#cv').value,min_order:$('#cm').value,max_uses:$('#cu').value,per_customer:$('#cp').value,max_discount:$('#cx').value,expires:$('#ce').value,note:$('#cn').value});load()}catch(x){}}
V.month=async()=>{const d=await P('month',{m:MON}),s=d.sum,mx=Math.max(1,...d.days.map(x=>x.amount));window.MD=d;
$('#v').innerHTML=`<div class="row"><button class="g" onclick="T='stats';load()">← Stats</button><button class="g" onclick="MON=shm(MON,-1);load()">‹</button><h2 style="margin:0 6px">${mname(d.m)}</h2><button class="g" onclick="MON=shm(MON,1);load()">›</button><input type="month" value="${d.m}" onchange="if(this.value){MON=this.value;load()}" style="width:auto"><span style="flex:1"></span><button class="g" onclick="dlM(0)">⬇ Orders CSV</button><button class="g" onclick="dlM(1)">⬇ Customers CSV</button></div>
<div class="kp"><div class="hl"><b>${R(s.revenue)}</b><span>Revenue</span></div><div><b>${s.orders}</b><span>Orders${s.cancelled?' · '+s.cancelled+' cancelled':''}</span></div><div><b>${R(s.avg)}</b><span>Average order</span></div><div><b>${s.packs}</b><span>Packs sold</span></div><div><b>${s.customers}</b><span>Customers · ${s.returning} returning</span></div><div><b>${R(s.discount)}</b><span>Coupon discount given</span></div></div>
<div class="c"><h3>Day by day</h3>${d.days.length?`<div class="dbar">${d.days.map(x=>`<div style="height:${Math.max(2,x.amount/mx*100)}%" title="${x.d}: ${x.orders} orders, ${R(x.amount)}"></div>`).join('')}</div><div class="dl">${d.days.map(x=>`<span>${x.d}</span>`).join('')}</div>`:'<p>No orders this month.</p>'}</div>
<div class="c"><h3>Customers (${d.customers.length})</h3><div style="overflow:auto"><table class="tb"><tr><th>#</th><th>Customer</th><th>Phone</th><th>Times ordered</th><th>Amount</th><th>Last order</th><th></th></tr>${d.customers.map((c,n)=>`<tr><td>${n+1}</td><td><b>${e(c.name)}</b> <span class="badge ${c.returning?'':'n'}">${c.returning?'Returning':'New'}</span></td><td>${e(c.phone)}</td><td><b>${c.orders}</b></td><td><b>${R(c.amount)}</b></td><td><small>${fdt(c.last)}</small></td><td>${wn(c.phone)?`<a target="_blank" href="https://wa.me/${wn(c.phone)}"><button style="background:#25d366">WhatsApp</button></a>`:''}</td></tr>`).join('')||'<tr><td colspan=7>None</td></tr>'}</table></div></div>
<div class="c"><h3>What sold this month</h3><div style="overflow:auto"><table class="tb"><tr><th>Product</th><th>Flavour</th><th>Packs</th><th>Amount</th></tr>${d.products.map(x=>`<tr><td>${e(x.product_name)}</td><td>${e(x.flavour)}</td><td><b>${x.packs}</b></td><td>${R(x.amt)}</td></tr>`).join('')||'<tr><td colspan=4>None</td></tr>'}</table></div></div>
<div class="c"><h3>All orders (${d.orders.length})</h3><div style="overflow:auto"><table class="tb"><tr><th>Date</th><th>Order</th><th>Customer</th><th>Status</th><th>Coupon</th><th>Total</th><th></th></tr>${d.orders.map(x=>`<tr><td><small>${fdt(x.created_at)}</small></td><td>${e(x.order_no)}</td><td>${e(x.name)}<br><small>${e(x.phone)}</small></td><td><span class="badge ${x.status=='cancelled'?'x':x.status=='new'?'n':''}">${x.status}</span></td><td>${x.coupon?`<span class="cpn">${e(x.coupon)}</span> − ${R(x.discount)}`:'-'}</td><td><b>${R(x.total)}</b></td><td><a target="_blank" href="${inv(x)}"><button class="g">Invoice</button></a></td></tr>`).join('')||'<tr><td colspan=7>None</td></tr>'}</table></div></div>`};
function dlM(k){const d=MD;if(k)dl('customers-'+d.m+'.csv',[['Customer','Phone','Times ordered','Amount','Type'],...d.customers.map(c=>[c.name,c.phone,c.orders,c.amount,c.returning?'Returning':'New'])]);else dl('orders-'+d.m+'.csv',[['Order','Date','Customer','Phone','Status','Coupon','Discount','Total'],...d.orders.map(x=>[x.order_no,x.created_at,x.name,x.phone,x.status,x.coupon,x.discount,x.total])])}
V.customers=async()=>{const c=await P('customers');window.CU=c;$('#v').innerHTML=`<div class="kp"><div class="hl"><b>${c.length}</b><span>Total customers</span></div><div><b>${c.filter(x=>x.orders>1).length}</b><span>Repeat customers</span></div><div><b>${R(c.reduce((a,x)=>a+x.amount,0))}</b><span>Lifetime sales</span></div></div><div class="row"><input placeholder="Search customer name / phone" oninput="cf2(this.value)" style="flex:1;min-width:200px"><select onchange="cs(this.value)"><option value="a">Top spenders</option><option value="o">Most orders</option><option value="r">Latest order</option></select><button class="g" onclick="dl('customers.csv',[['Customer','Phone','Orders','Total spent','First order','Last order'],...CU.map(x=>[x.name,x.phone,x.orders,x.amount,x.first,x.last])])">⬇ CSV</button></div><div id="cl"></div>`;cr(c)};
function cr(c){$('#cl').innerHTML=c.map(x=>`<div class="c cu" data-q="${e((x.name+' '+x.phone).toLowerCase())}"><div class="row"><b>${e(x.name)}</b> <span class="badge ${x.orders>1?'':'n'}">${x.orders>1?'Repeat · '+x.orders+' orders':'1 order'}</span><span>${e(x.phone)}</span><span style="margin-left:auto"><b>${R(x.amount)}</b></span>${wn(x.phone)?`<a target="_blank" href="https://wa.me/${wn(x.phone)}"><button style="background:#25d366">WhatsApp</button></a>`:''}<button class="g" onclick="co(this,'${e(x.key)}')">Orders</button></div><small>First: ${fdt(x.first)} · Last: ${fdt(x.last)}</small><div class="cd2"></div></div>`).join('')||'<p>No customers yet.</p>'}
function cs(m){cr([...CU].sort((a,b)=>m=='o'?b.orders-a.orders:m=='r'?String(b.last).localeCompare(a.last):b.amount-a.amount))}
function cf2(v){v=v.toLowerCase();document.querySelectorAll('.cu').forEach(c=>c.style.display=c.dataset.q.includes(v)?'':'none')}
async function co(b,k){const d=b.closest('.cu').querySelector('.cd2');if(d.innerHTML){d.innerHTML='';return}const o=await P('custOrders',{key:k});d.innerHTML='<table class="tb">'+o.map(x=>`<tr><td><small>${fdt(x.created_at)}</small></td><td>${e(x.order_no)}</td><td>${e(x.items)}</td><td><b>${R(x.total)}</b>${x.discount>0?`<br><span class="cpn">${e(x.coupon)}</span>`:''}</td><td><a target="_blank" href="${inv(x)}"><button class="g">Invoice</button></a></td></tr>`).join('')+'</table>'}
const rb=f=>new Promise((r,j)=>{const i=new Image;i.onload=()=>{const k=Math.min(1,1600/i.width),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);let q=.85,d;do{d=c.toDataURL('image/jpeg',q);q-=.08}while(d.length>900000&&q>.3);r(d)};i.onerror=()=>j();i.src=URL.createObjectURL(f)});
V.banners=async()=>{const b=await P('banners');window.BN=b;const td=new Date(Date.now()+19800000).toISOString().slice(0,10);
$('#v').innerHTML=`<div class="c"><h3>Add festival / offer banner</h3><p><small>Best size: 1600 × 600 px (any size works). With more than one banner, they slide automatically on the home page. Delete a banner and its space disappears from the website.</small></p><div class="row fl"><div style="min-width:220px"><label>Banner photo *</label><input type="file" id="bf" accept="image/*" onchange="bp(this)"></div><div><label>Title (optional, shown on banner)</label><input id="bt" maxlength="80" placeholder="e.g. Diwali Special 10% off"></div><div><label>Tap link (optional)</label><input id="bl" list="bll" placeholder="#/products"><datalist id="bll"><option value="#/products"><option value="#/wholesale"><option value="#/reviews"></datalist></div><div><label>Auto-hide after (optional)</label><input id="be" type="date"></div></div><img id="bpv" style="max-width:100%;max-height:160px;margin-top:8px;border-radius:10px" hidden><div class="row" style="margin-top:8px"><button id="bb" onclick="ba()">Add banner</button></div></div>`+(b.length?b.map((x,n)=>{const ex=x.ends&&x.ends<td,st=ex?'Expired':x.active?'Showing':'Hidden';return`<div class="c bni ${x.active&&!ex?'':'off'}"><img src="${e(x.image)}" alt=""><div style="flex:1;min-width:160px"><b>${e(x.title)||'(no title)'}</b><br><small>${x.link?'Link: '+e(x.link)+'<br>':''}${x.ends?'Auto-hide: '+e(x.ends)+'<br>':''}</small><span class="badge ${st=='Showing'?'':'x'}">${st}</span></div><div class="row"><button class="g" ${n?'':'disabled'} onclick="go('moveBanner',{id:${x.id},d:'up'})">↑</button><button class="g" ${n<b.length-1?'':'disabled'} onclick="go('moveBanner',{id:${x.id},d:'down'})">↓</button><button class="g" onclick="go('togBanner',{id:${x.id},v:${x.active?0:1}})">${x.active?'Hide':'Show'}</button><button class="g" onclick="be2(${n})">Edit</button><button class="r" onclick="if(confirm('Delete this banner? It will be removed from the website.'))go('delBanner',{id:${x.id}})">Delete</button></div></div>`}).join(''):'<div class="c">No banners yet. The home page shows no banner space until you add one.</div>')};
function bp(i){const f=i.files[0],v=$('#bpv');if(!f){v.hidden=true;return}v.src=URL.createObjectURL(f);v.hidden=false}
async function ba(){const f=$('#bf').files[0];if(!f)return alert('Choose a banner photo first');const b=$('#bb');b.disabled=true;b.textContent='Uploading...';try{await go('addBanner',{image:await rb(f),title:$('#bt').value,link:$('#bl').value,ends:$('#be').value})}catch(x){b.disabled=false;b.textContent='Add banner'}}
function be2(n){const {id,title:t,link:l,ends:e}=BN[n];const a=prompt('Banner title (empty = none)',t||'');if(a===null)return;const b=prompt('Tap link e.g. #/products (empty = none)',l||'');if(b===null)return;const c=prompt('Auto-hide after date YYYY-MM-DD (empty = never)',e||'');if(c===null)return;go('editBanner',{id,title:a,link:b,ends:c})}
V.staff=async()=>{const r=await P('users');$('#v').innerHTML=`<div class="c"><h3>Add user</h3><div class="row"><input id="ue" placeholder="Email"><input id="un" placeholder="Name"><input id="up" placeholder="Password (min 6)"><select id="ur"><option>staff</option><option>admin</option></select><button onclick="go('addU',{email:$('#ue').value,name:$('#un').value,password:$('#up').value,role:$('#ur').value})">Add</button></div></div>`+r.map(x=>`<div class="c">${e(x.name)} · ${e(x.email)} · <b>${x.role}</b> <button class="r" onclick="if(confirm('Remove user?'))go('delU',{id:${x.id}})">Remove</button></div>`).join('')};
setInterval(()=>{if(!U)return;P('dash').then(d=>{document.title=(d.pending?'('+d.pending+') ':'')+'BK Admin';if(T=='orders'&&LP!=null&&d.pending>LP){beep();load()}LP=d.pending}).catch(()=>{})},60000);
P('me').then(u=>{U=u;show()}).catch(()=>{});
</script></body></html>
